---
layout: default
title: Blog
permalink: /blog/
---
<h1 class="text-3xl font-bold text-[#0088FF] mb-8">Artikel</h1>
<div class="space-y-6">
{% for post in site.posts %}
  <a href="{{ post.url }}" class="block bg-white dark:bg-gray-800 rounded-xl shadow p-6 hover:shadow-lg transition">
    <h2 class="font-bold text-lg">{{ post.title }}</h2>
    <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">{{ post.date | date: "%d %b %Y" }}</p>
    <p class="text-sm mt-3">{{ post.excerpt | strip_html | truncate: 180 }}</p>
  </a>
{% else %}
  <p>Belum ada artikel.</p>
{% endfor %}
</div>

title: Lepari Blog
description: Catatan dan artikel keamanan siber
lang: id
# Ganti ke https://blog.mesra.id setelah Enforce HTTPS aktif
url: "http://blog.mesra.id"
timezone: Asia/Jakarta
baseurl: ""
permalink: /blog/:title/
collections:
  research:
    output: true
    permalink: /research/:name/
plugins:
  - jekyll-feed
exclude:
  - README.md
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: research
    values:
      layout: research
